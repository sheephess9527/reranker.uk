<!DOCTYPE html>
<html lang="{{HTML_LANG}}" data-locale="{{LOCALE}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="canonical" href="{{CANONICAL}}" />
  <link rel="alternate" hreflang="en" href="{{ALT_EN}}" />
  <link rel="alternate" hreflang="zh-Hans" href="{{ALT_ZH}}" />
  <link rel="alternate" hreflang="x-default" href="{{ALT_EN}}" />
  <meta name="theme-color" content="#0b0d17" />
  <meta name="robots" content="{{ROBOTS}}" />
  <meta name="author" content="reranker.uk" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="alternate" type="application/rss+xml" title="reranker.uk changelog" href="https://reranker.uk/changelog.rss" />
  <meta property="og:type" content="{{OG_TYPE}}" />
  <meta property="og:title" content="{{OG_TITLE}}" />
  <meta property="og:description" content="{{OG_DESCRIPTION}}" />
  <meta property="og:url" content="{{CANONICAL}}" />
  <meta property="og:site_name" content="reranker.uk" />
  <meta property="og:locale" content="{{OG_LOCALE}}" />
  <meta property="og:locale:alternate" content="{{OG_LOCALE_ALT}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta property="og:image" content="{{OG_IMAGE}}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{OG_IMAGE_ALT}}" />
  <meta name="twitter:image" content="{{OG_IMAGE}}" />
  <script>var t=null;try{t=localStorage.getItem("rr_theme");}catch(e){}if(t==="light"||(t!=="dark"&&window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.dataset.theme="light";</script>
  <link rel="preload" href="/assets/css/style.css" as="style" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  {{HEAD_EXTRA}}
