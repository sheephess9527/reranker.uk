name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the site
        run: npm run build

      # Static deployments serve committed public files; tests must not silently
      # repair stale pages that production would still publish. Sitemap lastmod
      # dates depend on checkout history and are intentionally excluded here.
      - name: Check committed generated pages are current
        run: |
          generated_status=$(git status --porcelain -- ':(glob)public/**/*.html' public/search-index.json public/llms.txt public/_headers)
          if [ -n "$generated_status" ]; then
            printf '%s\n' "$generated_status"
            echo "::error::Generated pages differ from the committed files. Run npm run build and commit its outputs."
            exit 1
          fi

      - name: Check for broken internal links
        run: npm run check:links

      - name: Check structured data (JSON-LD)
        run: npm run check:ld

      - name: Check social preview cards are current
        run: npm run check:og

      - name: Check Chinese translation coverage (informational)
        run: npm run check:zh

      - name: Demo smoke test (mocked network)
        run: npm test
