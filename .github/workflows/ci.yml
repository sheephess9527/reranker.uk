name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the site
        run: npm run build

      - name: Check for broken internal links
        run: npm run check:links

      - name: Check Chinese translation coverage (informational)
        run: npm run check:zh

      - name: Demo smoke test (mocked network)
        run: npm test
