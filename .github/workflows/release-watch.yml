name: Release watch

# Looks for new reranker releases (Hugging Face, vendor model pages) the site
# doesn't cover yet and opens a "release-watch" issue listing them. The
# scheduled Claude review (08:54 Beijing) dispatches this workflow itself and
# waits for it, because GitHub's own schedule below can run hours late (on
# 6 Oct 2026 the 07:47 run started at 11:20, after the review had finished);
# the schedule stays as a backup. Config and memory: data/release-watch.json.

on:
  schedule:
    - cron: "47 23 * * *" # 07:47 Beijing time, ahead of the Claude task
  workflow_dispatch:
    inputs:
      baseline:
        description: "Only print the model IDs each vendor page lists now (to seed `known`)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Look for new releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/watch-releases.mjs ${{ inputs.baseline && '--baseline' || '--issue' }}
