name: Demo smoke test (real network)

# Runs against real jsDelivr, HuggingFace, and hf-mirror.com infrastructure —
# no mocking. This is the one that would catch the demo silently breaking
# because a CDN moved, a model was renamed or pulled, or WASM init started
# failing — none of which the PR-time mocked test in ci.yml can see, since
# it fakes all three of those dependencies away.
#
# A failure here shows red in the Actions tab and GitHub emails the person
# who last edited this file by default (its built-in behavior for failed
# scheduled workflows) — no extra notification wiring in this workflow.

on:
  schedule:
    - cron: "17 3 * * *" # once daily; the odd minute avoids the top-of-hour GitHub Actions crowd
  workflow_dispatch:
    inputs:
      headers_base:
        description: "Origin the headers job checks (e.g. a Cloudflare preview URL, to test _headers before merging)"
        default: https://reranker.uk

jobs:
  demo-smoke-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the site
        run: npm run build

      - name: Demo smoke test (real network)
        run: npm run test:real

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

  # www.reranker.uk is a Cloudflare dashboard setting (a proxied DNS record +
  # a redirect rule), not code, so nothing in this repo would notice if it
  # were deleted — the site sat NXDOMAIN on www for months before Sep 2026.
  www-redirect:
    runs-on: ubuntu-latest
    steps:
      - name: www.reranker.uk 301s to the apex, keeping path and query
        run: |
          got=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' 'https://www.reranker.uk/models/?x=1')
          echo "got: $got"
          test "$got" = '301 https://reranker.uk/models/?x=1'

  # Vendors revise their own numbers (jina-reranker-v3's arXiv full text
  # already says 61.85 where its model card says 61.94), and nothing at
  # build time can see that. This re-reads every source in data/models.json
  # and fails if the figure the site renders is no longer there.
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Every models.json figure still appears at its source
        run: node scripts/check-sources.mjs --verbose

  # The demo's cross-origin isolation and its looser CSP are set in
  # public/_headers with Cloudflare's "! Name" detach syntax, which only
  # production can confirm. If isolation silently drops, the demo still works
  # but scores ~1.9x slower; if the detach stops working, /demo gets both CSPs.
  headers:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ inputs.headers_base || 'https://reranker.uk' }}
    steps:
      - name: the demo pages are isolated and carry exactly one CSP, with blob
        run: |
          for p in /demo /zh/demo; do
            h=$(curl -sSI "$BASE$p" | tr -d '\r')
            echo "== $p"; echo "$h"
            echo "$h" | grep -qi '^cross-origin-opener-policy: same-origin$'
            echo "$h" | grep -qi '^cross-origin-embedder-policy: credentialless$'
            test "$(echo "$h" | grep -ci '^content-security-policy-report-only:')" = 1
            echo "$h" | grep -i '^content-security-policy-report-only:' | grep -Eq "script-src [^;]* blob:"
          done
      - name: other pages are not isolated and keep the stricter CSP
        run: |
          h=$(curl -sSI "$BASE/models/" | tr -d '\r')
          echo "$h"
          # (no "! cmd" here: bash -e ignores a negated command's status)
          if echo "$h" | grep -qi '^cross-origin-embedder-policy:'; then echo "isolated"; exit 1; fi
          if echo "$h" | grep -i '^content-security-policy-report-only:' | grep -Eq "script-src [^;]* blob:"; then echo "blob: leaked"; exit 1; fi
